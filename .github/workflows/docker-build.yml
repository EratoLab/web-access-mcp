name: Build and Push Docker Image

# Note: We may switch between GitHub-hosted and Blacksmith-hosted runners in the future
# depending on cost and performance considerations.

on:
  push:
    branches: [ main ]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
    paths:
      - '.github/workflows/docker-build.yml'
      - 'src/**'
      - 'Dockerfile'
      - 'Dockerfile.Lightpanda'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/docker-build.yml'
      - 'src/**'
      - 'Dockerfile'
      - 'Dockerfile.Lightpanda'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  REGISTRY: harbor.imassage.me
  IMAGE_NAME: erato/web-access-mcp
  SHA_TAG: ${{ github.sha }}
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  lint-dockerfile:
    timeout-minutes: 10
    name: "lint dockerfile"
    runs-on: ubuntu-24.04 # blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        dockerfile:
          - Dockerfile
          - Dockerfile.Lightpanda
    steps:
      - uses: actions/checkout@v4

      - name: "Lint Dockerfile"
        uses: jbergstroem/hadolint-gh-action@v1.12.2
        with:
          dockerfile: ${{ matrix.dockerfile }}

#  cargo-clippy:
#    runs-on: ubuntu-24.04 # blacksmith-8vcpu-ubuntu-2404
#    name: "cargo clippy"
#    steps:
#      - uses: actions/checkout@v4
#
#      - name: "Install Rust toolchain"
#        run: rustup component add clippy
#
#      - uses: Swatinem/rust-cache@v2
#        with:
#          cache-all-crates: "true"
#
#      - name: "Clippy"
#        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04 # blacksmith-8vcpu-ubuntu-2404
    name: "test"
    steps:
      - uses: actions/checkout@v4

      - name: "Install Rust toolchain"
        run: cargo --help

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: "Run tests"
        run: cargo test --all-features

  build-and-push-amd64:
    runs-on: ubuntu-24.04 # blacksmith-8vcpu-ubuntu-2404
    needs: [lint-dockerfile, test]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - variant: chrome
            dockerfile: Dockerfile
          - variant: lightpanda
            dockerfile: Dockerfile.Lightpanda

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Harbor registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64-${{ matrix.variant }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}-amd64-${{ matrix.variant }}
            ${{ env.RELEASE_VERSION != '' && format('{0}/{1}:{2}-amd64-{3}', env.REGISTRY, env.IMAGE_NAME, env.RELEASE_VERSION, matrix.variant) || '' }}

  build-and-push-arm64:
    runs-on: ubuntu-24.04-arm64-custom-large # blacksmith-8vcpu-ubuntu-2404-arm
    needs: [lint-dockerfile, test]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - variant: chrome
            dockerfile: Dockerfile
          - variant: lightpanda
            dockerfile: Dockerfile.Lightpanda

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Harbor registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64-${{ matrix.variant }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}-arm64-${{ matrix.variant }}
            ${{ env.RELEASE_VERSION != '' && format('{0}/{1}:{2}-arm64-{3}', env.REGISTRY, env.IMAGE_NAME, env.RELEASE_VERSION, matrix.variant) || '' }}

  create-manifests:
    needs: [build-and-push-amd64, build-and-push-arm64]
    runs-on: ubuntu-24.04 # blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Log in to Harbor registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifests
        run: |
          # Create multi-arch manifests for Chrome and keep unsuffixed aliases pointing to Chrome.
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-chrome \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64-chrome \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64-chrome

          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}-chrome \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}-amd64-chrome \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}-arm64-chrome

          # Create multi-arch manifests for LightPanda.
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-lightpanda \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64-lightpanda \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64-lightpanda

          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}-lightpanda \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}-amd64-lightpanda \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}-arm64-lightpanda

          # Create multi-arch manifests for release version (if tagged).
          if [[ "${{ env.RELEASE_VERSION }}" != "" ]]; then
            docker buildx imagetools create \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}-chrome \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}-amd64-chrome \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}-arm64-chrome

            docker buildx imagetools create \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}-lightpanda \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}-amd64-lightpanda \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}-arm64-lightpanda
          fi

  create-github-release:
    needs: [create-manifests]
    runs-on: ubuntu-24.04 # blacksmith-4vcpu-ubuntu-2404
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate release notes
        id: generate_notes
        run: |
          NOTES="## Browser Use RS - Release ${{ github.ref_name }}

          ### Docker Image

          Pull the Docker image for this release:

          \`\`\`bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-chrome
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-lightpanda
          \`\`\`

          Multi-architecture support: amd64, arm64. Unsuffixed tags point to the Chrome image.

          ### Changes

          See the commit history for details on what changed in this release.

          ### Registry Information

          - **Registry**: ${{ env.REGISTRY }}
          - **Image**: ${{ env.IMAGE_NAME }}
          - **Tag**: ${{ github.ref_name }}
          "

          # Using a delimiter for multiline output
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.generate_notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
